<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Yamify - Future Music Streaming & Download Platform"/>
<meta name="theme-color" content="#0a0a1a"/>
<title>Yamify — Future Music Studio ✦ Premium Audio Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:         #0a0a1a;
  --bg2:        #0f0f24;
  --card:       #14142e;
  --card2:      #1a1a3a;
  --border:     #2a2a4a;
  --fg:         #ffffff;
  --muted:      #a0a0c0;
  --muted2:     #606080;
  --cyan:       #00f0ff;
  --cyan2:      #00ccff;
  --blue:       #3a6eff;
  --purple:     #b44eff;
  --pink:       #ff44cc;
  --gold:       #ffcc44;
  --danger:     #ff4466;
  --success:    #44ff88;
  --warning:    #ffaa44;

  --a1: var(--cyan);
  --a2: var(--blue);
  --grd: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple), var(--pink));
  --grd-text: linear-gradient(135deg, var(--cyan), var(--purple), var(--pink));
  --shadow-sm: 0 4px 20px rgba(0,0,0,0.3);
  --shadow-md: 0 8px 30px rgba(0,0,0,0.4);
  --shadow-lg: 0 20px 50px rgba(0,0,0,0.5);
  --shadow-glow: 0 0 30px rgba(0,240,255,0.3);
}

body{
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--fg);
  min-height:100vh;
  overflow-x:hidden;
  line-height:1.5;
}

/* Canvas BG */
#canvas-bg{
  position:fixed;inset:0;z-index:0;
  pointer-events:none;
  opacity:0.4;
}

/* Ambient Layers */
#amb{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px circle at 10% -10%, rgba(0,240,255,0.15), transparent 55%),
    radial-gradient(900px circle at 95% 5%, rgba(58,110,255,0.1), transparent 55%),
    radial-gradient(800px circle at 50% 110%, rgba(180,78,255,0.08), transparent 55%);
}
#vgn{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, transparent 40%, rgba(0,0,0,0.6) 100%);
}
#scl{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,240,255,0.03) 2px, rgba(0,240,255,0.03) 3px);
  mix-blend-mode:overlay;
}

/* Layout */
header,main,.player,.toast-container{position:relative;z-index:2;}

/* Header Premium */
header{
  border-bottom:1px solid rgba(0,240,255,0.2);
  backdrop-filter:blur(32px) saturate(180%);
  background:rgba(10,10,26,0.7);
  position:sticky;top:0;z-index:100;
}
.hdr{
  max-width:1200px;margin:0 auto;
  padding:16px 28px;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{display:flex;align-items:center;gap:16px;}
.logo-orb{
  position:relative;width:48px;height:48px;
}
.logo-orb-glow{
  position:absolute;inset:-4px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  filter:blur(12px);opacity:0.7;
}
.logo-orb-inner{
  position:relative;
  width:48px;height:48px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.logo-text .brand{
  font-size:22px;font-weight:900;letter-spacing:-0.5px;
  background:var(--grd-text);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo-text .sub{font-size:9px;color:var(--muted);letter-spacing:0.3em;margin-top:4px;}
.hdr-right{display:flex;align-items:center;gap:16px;}
.badge{
  font-size:10px;font-weight:600;padding:6px 16px;
  background:rgba(0,240,255,0.1);
  border:1px solid rgba(0,240,255,0.3);
  border-radius:100px;
  color:var(--cyan);
}
.status-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--success);
  box-shadow:0 0 12px var(--success);
  animation:pulse-dot 2s ease infinite;
}

/* Hero Section */
.hero{
  max-width:900px;margin:0 auto;
  padding:80px 24px 48px;
  text-align:center;
}
.hero-pill{
  display:inline-flex;align-items:center;gap:8px;
  font-size:11px;font-weight:600;letter-spacing:0.2em;
  padding:8px 20px;
  background:rgba(0,240,255,0.08);
  border:1px solid rgba(0,240,255,0.2);
  border-radius:100px;
  margin-bottom:32px;
}
.hero-pill span{color:var(--cyan);}
.hero h1{
  font-size:clamp(48px,10vw,96px);
  font-weight:900;line-height:1;
  margin-bottom:24px;
}
.txt-neon{
  display:block;
  color:var(--cyan);
  text-shadow:0 0 20px rgba(0,240,255,0.5);
}
.txt-holo{
  display:block;
  background:var(--grd-text);
  background-size:300% 300%;
  animation:holo 4s ease infinite;
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}
.hero p{
  font-size:15px;color:var(--muted);
  max-width:500px;margin:0 auto;
}
.hero-stats{
  display:flex;justify-content:center;gap:40px;
  margin-top:40px;
}
.stat .stat-val{
  font-size:28px;font-weight:800;
  color:var(--cyan);
}
.stat .stat-lbl{font-size:10px;color:var(--muted2);letter-spacing:0.1em;}

/* Main Content */
.wrap{max-width:800px;margin:0 auto;padding:0 24px;}

/* Tabs Premium */
.tabs{
  position:relative;display:flex;gap:4px;
  background:rgba(20,20,46,0.8);
  backdrop-filter:blur(16px);
  border:1px solid rgba(0,240,255,0.15);
  border-radius:60px;
  padding:6px;
  margin-bottom:32px;
}
.tab-ind{
  position:absolute;top:6px;bottom:6px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  border-radius:60px;
  transition:left 0.4s cubic-bezier(0.4,0,0.2,1),width 0.4s cubic-bezier(0.4,0,0.2,1);
  pointer-events:none;
  box-shadow:0 0 20px rgba(0,240,255,0.5);
}
.tab{
  position:relative;z-index:1;flex:1;
  padding:14px 20px;
  background:none;border:none;
  font-family:inherit;font-size:13px;font-weight:700;
  color:var(--muted);
  cursor:pointer;
  transition:all 0.3s;
  border-radius:60px;
}
.tab.active{
  color:var(--bg);
}
.tab:not(.active):hover{
  color:var(--fg);
  background:rgba(255,255,255,0.05);
}

/* Input Form */
.form-wrap{margin-bottom:24px;}
.input-border{
  padding:2px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  border-radius:60px;
  transition:box-shadow 0.3s;
}
.input-border:focus-within{
  box-shadow:0 0 40px rgba(0,240,255,0.4);
}
.input-inner{
  display:flex;align-items:center;
  background:rgba(20,20,46,0.95);
  backdrop-filter:blur(20px);
  border-radius:60px;
  overflow:hidden;
}
.inp-ico{
  padding:0 20px;
  color:var(--cyan);
  font-size:18px;
}
.input-inner input{
  flex:1;
  height:60px;
  background:none;
  border:none;
  outline:none;
  font-family:inherit;
  font-size:15px;
  color:var(--fg);
}
.input-inner input::placeholder{color:var(--muted2);}
.submit{
  margin:6px;
  height:48px;
  padding:0 32px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  border:none;
  border-radius:60px;
  cursor:pointer;
  font-family:inherit;
  font-size:12px;
  font-weight:800;
  letter-spacing:0.1em;
  color:var(--bg);
  transition:transform 0.2s,filter 0.2s;
}
.submit:hover{transform:scale(1.02);filter:brightness(1.1);}
.submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;}

/* Error Toast */
.toast-container{
  position:fixed;
  top:80px;
  right:20px;
  z-index:1000;
  display:flex;
  flex-direction:column;
  gap:12px;
  pointer-events:none;
}
.toast{
  pointer-events:auto;
  background:rgba(20,20,46,0.95);
  backdrop-filter:blur(20px);
  border-left:4px solid var(--danger);
  border-radius:12px;
  padding:16px 20px;
  display:flex;
  align-items:flex-start;
  gap:12px;
  min-width:280px;
  max-width:400px;
  box-shadow:var(--shadow-lg);
  animation:slideIn 0.3s ease;
}
.toast.success{border-left-color:var(--success);}
.toast.warning{border-left-color:var(--warning);}
.toast.info{border-left-color:var(--cyan);}
.toast-icon{font-size:24px;}
.toast-content{flex:1;}
.toast-title{font-weight:700;margin-bottom:4px;}
.toast-message{font-size:13px;color:var(--muted);}
.toast-close{
  background:none;
  border:none;
  color:var(--muted);
  cursor:pointer;
  font-size:18px;
  padding:0 4px;
}
@keyframes slideIn{
  from{transform:translateX(100%);opacity:0;}
  to{transform:translateX(0);opacity:1;}
}

/* Results Section */
.sec-hdr{
  display:flex;justify-content:space-between;align-items:center;
  margin:32px 0 16px;
}
.sec-lbl{
  font-size:11px;font-weight:700;letter-spacing:0.2em;
  color:var(--muted);
}
.clr{
  background:none;border:none;
  color:var(--muted2);
  font-size:11px;
  cursor:pointer;
  transition:color 0.2s;
}
.clr:hover{color:var(--cyan);}

/* Track List */
.list{display:flex;flex-direction:column;gap:12px;}
.row{
  display:flex;align-items:center;gap:16px;
  padding:12px 16px;
  background:rgba(20,20,46,0.6);
  backdrop-filter:blur(10px);
  border:1px solid rgba(0,240,255,0.1);
  border-radius:16px;
  cursor:pointer;
  transition:all 0.3s;
}
.row:hover{
  border-color:rgba(0,240,255,0.3);
  background:rgba(20,20,46,0.8);
  transform:translateX(4px);
}
.row.active{
  border-color:var(--cyan);
  background:rgba(0,240,255,0.05);
  box-shadow:0 0 30px rgba(0,240,255,0.2);
}
.row-num{
  font-size:12px;font-weight:600;
  color:var(--muted2);
  width:32px;
}
.thumb{
  position:relative;
  width:56px;height:56px;
  border-radius:12px;
  overflow:hidden;
  background:var(--grd);
  display:flex;align-items:center;justify-content:center;
  font-size:24px;
}
.thumb img{
  width:100%;height:100%;
  object-fit:cover;
}
.eq-ov{
  position:absolute;inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:flex-end;
  justify-content:center;
  gap:3px;
  padding:8px;
}
.row.active.playing .eq-ov{display:flex;}
.bar{
  width:3px;background:var(--cyan);
  border-radius:2px;
  animation:eq 0.8s ease infinite;
}
.bar:nth-child(1){height:30%;animation-delay:0s;}
.bar:nth-child(2){height:50%;animation-delay:0.1s;}
.bar:nth-child(3){height:40%;animation-delay:0.2s;}
.bar:nth-child(4){height:70%;animation-delay:0.3s;}

.trk-info{flex:1;min-width:0;}
.trk-title{
  font-size:14px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row.active .trk-title{color:var(--cyan);}
.trk-artist{
  font-size:12px;color:var(--muted);
  margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.trk-meta{
  font-size:10px;color:var(--muted2);
  margin-top:4px;
  display:flex;gap:12px;
}
.pbtn{
  width:44px;height:44px;
  border-radius:12px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  border:none;
  cursor:pointer;
  font-size:16px;
  transition:transform 0.2s;
}
.pbtn:hover{transform:scale(1.05);}

/* Empty State */
.empty{
  text-align:center;
  padding:80px 32px;
  background:rgba(20,20,46,0.4);
  border-radius:24px;
  border:1px dashed rgba(0,240,255,0.2);
  margin-top:32px;
}
.empty-icon{
  width:80px;height:80px;
  margin:0 auto 24px;
  background:var(--grd);
  border-radius:40px;
  display:flex;align-items:center;justify-content:center;
  font-size:36px;
}
.empty h3{font-size:18px;margin-bottom:8px;}
.empty p{font-size:13px;color:var(--muted);}

/* Player Premium */
.player{
  position:fixed;bottom:0;left:0;right:0;z-index:100;
  display:none;
}
.player.show{display:block;animation:slideUp 0.4s ease;}
@keyframes slideUp{
  from{transform:translateY(100%);}
  to{transform:translateY(0);}
}
.player-shell{
  background:rgba(10,10,26,0.95);
  backdrop-filter:blur(40px);
  border-top:1px solid rgba(0,240,255,0.3);
  box-shadow:0 -20px 50px rgba(0,0,0,0.5);
}
.prog{
  height:4px;
  background:rgba(255,255,255,0.1);
  cursor:pointer;
  position:relative;
}
.prog-fill{
  position:absolute;left:0;top:0;bottom:0;
  background:var(--grd);
  background-size:200% 100%;
  animation:holo-x 3s ease infinite;
  transition:width 0.1s linear;
}
.prog-glow{
  position:absolute;right:-2px;top:-4px;bottom:-4px;
  width:4px;
  background:white;
  border-radius:2px;
  box-shadow:0 0 12px white;
}
.player-inner{
  max-width:1200px;margin:0 auto;
  padding:16px 24px;
  display:flex;align-items:center;gap:20px;
}
.p-cover{
  position:relative;
  width:60px;height:60px;
  border-radius:12px;
  overflow:hidden;
}
.p-cover-glow{
  position:absolute;inset:-4px;
  background:var(--grd);
  filter:blur(12px);
  opacity:0.6;
  border-radius:16px;
}
.p-cover img{
  position:relative;
  width:100%;height:100%;
  object-fit:cover;
  border-radius:12px;
}
.p-cover img.spinning{animation:spin 8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.p-info{flex:1;min-width:0;}
.p-title{
  font-size:16px;font-weight:800;
  color:var(--cyan);
}
.p-artist{font-size:13px;color:var(--muted);margin-top:2px;}
.p-time{font-size:11px;color:var(--muted2);margin-top:4px;}
.p-play{
  width:56px;height:56px;
  border-radius:28px;
  background:var(--grd);
  background-size:200% 200%;
  animation:holo 4s ease infinite;
  border:none;
  cursor:pointer;
  font-size:22px;
  transition:transform 0.2s;
}
.p-play:hover{transform:scale(1.05);}
.p-actions{display:flex;gap:8px;}
.ico{
  width:40px;height:40px;
  background:rgba(255,255,255,0.05);
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-size:16px;
  transition:all 0.2s;
}
.ico:hover{background:rgba(0,240,255,0.2);color:var(--cyan);}
.dl-btn{
  width:40px;height:40px;
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  text-decoration:none;
  color:var(--fg);
  font-size:18px;
  transition:all 0.2s;
}
.dl-btn:hover{background:rgba(0,240,255,0.2);color:var(--cyan);transform:scale(1.05);}

/* Animations */
@keyframes holo{
  0%,100%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
}
@keyframes holo-x{
  0%,100%{background-position:0% 0%;}
  50%{background-position:100% 0%;}
}
@keyframes pulse-dot{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:0.5;transform:scale(0.8);}
}
@keyframes eq{
  0%,100%{transform:scaleY(0.3);}
  50%{transform:scaleY(1);}
}

/* Scrollbar */
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);}
::-webkit-scrollbar-thumb{background:var(--cyan);border-radius:3px;}

/* Responsive */
@media(max-width:768px){
  .hero{padding:40px 20px;}
  .hero-stats{gap:20px;}
  .stat .stat-val{font-size:20px;}
  .player-inner{gap:12px;padding:12px 16px;}
  .p-play{width:48px;height:48px;font-size:18px;}
  .p-cover{width:48px;height:48px;}
}
</style>
</head>
<body>

<canvas id="canvas-bg"></canvas>
<div id="amb"></div>
<div id="vgn"></div>
<div id="scl"></div>

<header>
  <div class="hdr">
    <div class="logo">
      <div class="logo-orb">
        <div class="logo-orb-glow"></div>
        <div class="logo-orb-inner">🎵</div>
      </div>
      <div class="logo-text">
        <div class="brand">YAMIFY</div>
        <div class="sub">PREMIUM AUDIO STUDIO</div>
      </div>
    </div>
    <div class="hdr-right">
      <div class="status-dot"></div>
      <div class="badge">✦ STUDIO v3.0</div>
    </div>
  </div>
</header>

<div class="hero">
  <div class="hero-pill"><span>⚡</span> POWERED BY SPOTIFY API</div>
  <h1>
    <span class="txt-neon">SOUND OF</span>
    <span class="txt-holo">TOMORROW.</span>
  </h1>
  <p>Stream, download, and experience music in ultra-high quality with futuristic interface.</p>
  <div class="hero-stats">
    <div class="stat"><div class="stat-val">∞</div><div class="stat-lbl">TRACKS</div></div>
    <div class="stat"><div class="stat-val">320kbps</div><div class="stat-lbl">QUALITY</div></div>
    <div class="stat"><div class="stat-val">0.5s</div><div class="stat-lbl">LATENCY</div></div>
  </div>
</div>

<div class="wrap">
  <div class="tabs" id="tabs">
    <div class="tab-ind" id="tabInd"></div>
    <button class="tab active" id="tabSearch" onclick="switchTab('search')">🔍 SEARCH</button>
    <button class="tab" id="tabDownload" onclick="switchTab('downloader')">⬇ DOWNLOADER</button>
  </div>

  <div class="form-wrap">
    <form onsubmit="handleSubmit(event)">
      <div class="input-border">
        <div class="input-inner">
          <div class="inp-ico" id="inputIcon">🔍</div>
          <input type="text" id="mainInput" placeholder="Search songs, artists, or albums..." autocomplete="off"/>
          <button class="submit" type="submit" id="submitBtn">
            <span id="submitLabel">SEARCH</span>
          </button>
        </div>
      </div>
    </form>
  </div>

  <div id="resultsArea"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<div class="player" id="player">
  <div class="player-shell">
    <div class="prog" id="progressBar" onclick="seekTrack(event)">
      <div class="prog-fill" id="progressFill"></div>
      <div class="prog-glow" id="progressGlow"></div>
    </div>
    <div class="player-inner">
      <div class="p-cover">
        <div class="p-cover-glow"></div>
        <img id="playerCover" src="" alt=""/>
      </div>
      <div class="p-info">
        <div class="p-title" id="playerTitle">—</div>
        <div class="p-artist" id="playerArtist">—</div>
        <div class="p-time" id="playerTime">0:00 / 0:00</div>
      </div>
      <button class="p-play" id="playerPlayBtn" onclick="togglePlayerPlay()">▶</button>
      <div class="p-actions">
        <button class="ico" id="muteBtn" onclick="toggleMuteTrack()">🔊</button>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.8" oninput="setTrackVolume(this.value)"/>
        <a class="dl-btn" id="downloadLink" href="#" download>⬇</a>
        <button class="ico" onclick="closePlayerPanel()">✕</button>
      </div>
    </div>
  </div>
</div>

<audio id="audioElement"></audio>

<script>
// ========== STATE ==========
let currentMode = 'search';
let searchResults = [];
let activeTrackUrl = null;
let isTrackPlaying = false;
let isAudioMuted = false;
let currentTrackData = null;
let audio = document.getElementById('audioElement');

// ========== PARTICLE BACKGROUND ==========
(function(){
  const canvas = document.getElementById('canvas-bg');
  const ctx = canvas.getContext('2d');
  let width, height, particles = [];
  const PARTICLE_COUNT = 120;
  
  function initCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    particles = [];
    for(let i = 0; i < PARTICLE_COUNT; i++){
      particles.push({
        x: Math.random() * width,
        y: Math.random() * height,
        vx: (Math.random() - 0.5) * 0.3,
        vy: (Math.random() - 0.5) * 0.3,
        r: Math.random() * 2 + 1,
        alpha: Math.random() * 0.3 + 0.1
      });
    }
  }
  
  function drawParticles(){
    ctx.clearRect(0, 0, width, height);
    for(let p of particles){
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < 0) p.x = width;
      if(p.x > width) p.x = 0;
      if(p.y < 0) p.y = height;
      if(p.y > height) p.y = 0;
      
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(0, 200, 255, ${p.alpha})`;
      ctx.fill();
    }
    requestAnimationFrame(drawParticles);
  }
  
  window.addEventListener('resize', () => { initCanvas(); });
  initCanvas();
  drawParticles();
})();

// ========== TOAST NOTIFICATION ==========
function showToast(message, type = 'error'){
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  toast.innerHTML = `
    <div class="toast-icon">${type === 'error' ? '⚠️' : type === 'success' ? '✅' : 'ℹ️'}</div>
    <div class="toast-content">
      <div class="toast-title">${type === 'error' ? 'Error' : type === 'success' ? 'Success' : 'Info'}</div>
      <div class="toast-message">${message}</div>
    </div>
    <button class="toast-close" onclick="this.parentElement.remove()">✕</button>
  `;
  container.appendChild(toast);
  setTimeout(() => toast.remove(), 5000);
}

// ========== TAB SYSTEM ==========
function updateTabIndicator(){
  const activeTab = document.querySelector(`.tab.${currentMode === 'search' ? 'active' : ''}`);
  const tabs = document.getElementById('tabs');
  const indicator = document.getElementById('tabInd');
  if(activeTab && tabs){
    const tabRect = activeTab.getBoundingClientRect();
    const tabsRect = tabs.getBoundingClientRect();
    indicator.style.left = (tabRect.left - tabsRect.left) + 'px';
    indicator.style.width = tabRect.width + 'px';
  }
}

function switchTab(mode){
  currentMode = mode;
  document.getElementById('tabSearch').classList.toggle('active', mode === 'search');
  document.getElementById('tabDownload').classList.toggle('active', mode === 'downloader');
  document.getElementById('inputIcon').textContent = mode === 'search' ? '🔍' : '🔗';
  document.getElementById('submitLabel').textContent = mode === 'search' ? 'SEARCH' : 'GET TRACK';
  document.getElementById('mainInput').placeholder = mode === 'search' 
    ? 'Search songs, artists, or albums...' 
    : 'Paste Spotify track URL here...';
  document.getElementById('mainInput').value = '';
  updateTabIndicator();
  if(mode === 'search'){
    if(searchResults.length) renderSearchResults();
    else renderEmptyState('search');
  } else {
    renderEmptyState('downloader');
  }
}

// ========== RENDER FUNCTIONS ==========
function renderEmptyState(type){
  const area = document.getElementById('resultsArea');
  const isSearch = type === 'search';
  area.innerHTML = `
    <div class="empty">
      <div class="empty-icon">${isSearch ? '🎧' : '🔗'}</div>
      <h3>${isSearch ? 'Start Your Musical Journey' : 'Download Any Track'}</h3>
      <p>${isSearch 
        ? 'Search for your favorite songs, artists, or albums above.' 
        : 'Paste a Spotify track URL and get instant MP3 download.'}</p>
    </div>
  `;
}

function renderSearchResults(){
  if(!searchResults.length){
    renderEmptyState('search');
    return;
  }
  
  const area = document.getElementById('resultsArea');
  area.innerHTML = `
    <div class="sec-hdr">
      <div class="sec-lbl">📀 ${searchResults.length} TRACKS FOUND</div>
      <button class="clr" onclick="clearSearchResults()">CLEAR ALL</button>
    </div>
    <div class="list" id="trackList"></div>
  `;
  
  const listContainer = document.getElementById('trackList');
  searchResults.forEach((track, idx) => {
    const isActive = activeTrackUrl === track.url;
    const row = document.createElement('div');
    row.className = `row ${isActive ? 'active' : ''} ${isActive && isTrackPlaying ? 'playing' : ''}`;
    row.innerHTML = `
      <div class="row-num">${String(idx + 1).padStart(2, '0')}</div>
      <div class="thumb">
        ${track.thumb ? `<img src="${track.thumb}" alt="cover"/>` : '🎵'}
        <div class="eq-ov">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
      </div>
      <div class="trk-info">
        <div class="trk-title">${escapeHtml(track.title)}</div>
        <div class="trk-artist">${escapeHtml(track.artist)}</div>
        <div class="trk-meta">
          ${track.duration ? `<span>⏱ ${track.duration}</span>` : ''}
          ${track.pop ? `<span>★ ${track.pop}</span>` : ''}
        </div>
      </div>
      <button class="pbtn" data-index="${idx}">${isActive && isTrackPlaying ? '⏸' : '▶'}</button>
    `;
    row.addEventListener('click', (e) => {
      if(e.target.tagName !== 'BUTTON') handleTrackClick(idx);
    });
    row.querySelector('.pbtn').addEventListener('click', (e) => {
      e.stopPropagation();
      handleTrackClick(idx);
    });
    listContainer.appendChild(row);
  });
}

// ========== API HANDLERS ==========
async function handleSubmit(e){
  e.preventDefault();
  const input = document.getElementById('mainInput').value.trim();
  if(!input) return;
  
  const btn = document.getElementById('submitBtn');
  const label = document.getElementById('submitLabel');
  btn.disabled = true;
  label.innerHTML = '<span style="animation:spin 1s linear infinite;">◌</span> LOADING...';
  
  if(currentMode === 'search'){
    await performSearch(input);
  } else {
    await fetchTrack(input);
  }
  
  btn.disabled = false;
  label.innerHTML = currentMode === 'search' ? 'SEARCH' : 'GET TRACK';
}

async function performSearch(query){
  try{
    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    const data = await response.json();
    
    if(data.error){
      showToast(data.message || data.hint || 'Search failed', 'error');
      renderEmptyState('search');
      return;
    }
    
    const tracks = data.data || data.results || [];
    if(!tracks.length){
      showToast('No results found. Try different keywords.', 'warning');
      renderEmptyState('search');
      return;
    }
    
    searchResults = tracks.map(t => ({
      title: t.title || t.name || 'Unknown',
      artist: t.artist || t.artists || 'Unknown Artist',
      duration: t.duration || '',
      pop: t.popularity || null,
      thumb: t.thumbnail || t.image || t.cover || '',
      url: t.url || t.spotify_url || t.link || ''
    }));
    
    renderSearchResults();
    showToast(`Found ${searchResults.length} tracks!`, 'success');
  } catch(err){
    showToast('Network error. Please check your connection.', 'error');
    renderEmptyState('search');
  }
}

async function fetchTrack(url){
  try{
    const response = await fetch(`/api/track?url=${encodeURIComponent(url)}`);
    const data = await response.json();
    
    if(data.error){
      showToast(data.message || data.hint || 'Failed to fetch track', 'error');
      return;
    }
    
    const track = data.data;
    if(!track || !track.audioUrl){
      showToast('Download link not available for this track.', 'error');
      return;
    }
    
    currentTrackData = {
      title: track.title,
      artist: track.artist,
      duration: track.duration,
      thumb: track.thumbnail,
      audioUrl: track.audioUrl,
      spotifyUrl: url
    };
    
    activeTrackUrl = url;
    openPlayerPanel(currentTrackData);
    showToast('Track loaded successfully!', 'success');
    
    if(currentMode === 'search' && searchResults.length){
      renderSearchResults();
    }
  } catch(err){
    showToast('Network error. Please try again.', 'error');
  }
}

// ========== TRACK PLAYER ==========
function handleTrackClick(index){
  const track = searchResults[index];
  if(activeTrackUrl === track.url){
    togglePlayerPlay();
  } else {
    fetchTrack(track.url);
  }
}

function openPlayerPanel(track){
  document.getElementById('playerTitle').textContent = track.title;
  document.getElementById('playerArtist').textContent = track.artist;
  const cover = document.getElementById('playerCover');
  if(track.thumb){
    cover.src = track.thumb;
    cover.style.display = 'block';
  } else {
    cover.style.display = 'none';
  }
  document.getElementById('downloadLink').href = track.audioUrl;
  document.getElementById('downloadLink').download = `${track.title}.mp3`;
  
  audio.src = track.audioUrl;
  audio.volume = parseFloat(document.getElementById('volumeSlider').value);
  audio.play().then(() => {
    isTrackPlaying = true;
    updatePlayerUI();
    document.getElementById('player').classList.add('show');
  }).catch(err => {
    showToast('Cannot play audio. Format may not be supported.', 'error');
  });
  
  setupAudioEvents();
}

function setupAudioEvents(){
  audio.onplay = () => { isTrackPlaying = true; updatePlayerUI(); };
  audio.onpause = () => { isTrackPlaying = false; updatePlayerUI(); };
  audio.ontimeupdate = updateProgressBar;
  audio.onended = () => { isTrackPlaying = false; updatePlayerUI(); };
}

function updatePlayerUI(){
  const playBtn = document.getElementById('playerPlayBtn');
  playBtn.textContent = isTrackPlaying ? '⏸' : '▶';
  const cover = document.getElementById('playerCover');
  if(isTrackPlaying) cover.classList.add('spinning');
  else cover.classList.remove('spinning');
  
  if(currentMode === 'search' && searchResults.length){
    renderSearchResults();
  }
}

function togglePlayerPlay(){
  if(isTrackPlaying){
    audio.pause();
  } else {
    audio.play();
  }
}

function updateProgressBar(){
  if(audio.duration){
    const percent = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
    document.getElementById('progressGlow').style.left = percent + '%';
    document.getElementById('playerTime').textContent = 
      `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }
}

function seekTrack(e){
  const rect = document.getElementById('progressBar').getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
}

function setTrackVolume(val){
  audio.volume = parseFloat(val);
  if(audio.volume > 0) isAudioMuted = false;
  updateMuteIcon();
}

function toggleMuteTrack(){
  isAudioMuted = !isAudioMuted;
  audio.volume = isAudioMuted ? 0 : parseFloat(document.getElementById('volumeSlider').value);
  updateMuteIcon();
}

function updateMuteIcon(){
  const muteBtn = document.getElementById('muteBtn');
  muteBtn.textContent = isAudioMuted ? '🔇' : '🔊';
}

function closePlayerPanel(){
  audio.pause();
  isTrackPlaying = false;
  activeTrackUrl = null;
  currentTrackData = null;
  document.getElementById('player').classList.remove('show');
  if(currentMode === 'search' && searchResults.length){
    renderSearchResults();
  }
}

function clearSearchResults(){
  searchResults = [];
  activeTrackUrl = null;
  renderEmptyState('search');
  closePlayerPanel();
}

function formatTime(seconds){
  if(isNaN(seconds)) return '0:00';
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${secs.toString().padStart(2, '0')}`;
}

function escapeHtml(str){
  if(!str) return '';
  return str.replace(/[&<>]/g, function(m){
    if(m === '&') return '&amp;';
    if(m === '<') return '&lt;';
    if(m === '>') return '&gt;';
    return m;
  });
}

// ========== INIT ==========
window.addEventListener('load', () => {
  switchTab('search');
  updateTabIndicator();
  window.addEventListener('resize', updateTabIndicator);
});
</script>
