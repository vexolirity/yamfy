<!-- index.html -->
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yamify - Music Streaming</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  background: #0a0a0f;
  color: #fff;
  min-height: 100vh;
}

.container {
  max-width: 800px;
  margin: 0 auto;
  padding: 20px;
}

header {
  text-align: center;
  padding: 40px 20px;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  border-radius: 0 0 30px 30px;
  margin-bottom: 30px;
}

h1 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.subtitle {
  opacity: 0.9;
  font-size: 0.9rem;
}

.tabs {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  background: #1a1a2e;
  padding: 5px;
  border-radius: 50px;
}

.tab {
  flex: 1;
  padding: 12px;
  background: transparent;
  border: none;
  color: #888;
  font-weight: 600;
  cursor: pointer;
  border-radius: 50px;
  transition: all 0.3s;
}

.tab.active {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 30px;
}

.search-input {
  flex: 1;
  padding: 15px 20px;
  background: #1a1a2e;
  border: 1px solid #2a2a3e;
  border-radius: 50px;
  color: white;
  font-size: 1rem;
  outline: none;
  transition: all 0.3s;
}

.search-input:focus {
  border-color: #667eea;
}

.search-btn {
  padding: 15px 30px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 50px;
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s;
}

.search-btn:hover {
  transform: scale(1.02);
}

.search-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.results {
  display: flex;
  flex-direction: column;
  gap: 15px;
  margin-bottom: 100px;
}

.track-card {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px;
  background: #1a1a2e;
  border-radius: 15px;
  cursor: pointer;
  transition: all 0.3s;
  border: 1px solid #2a2a3e;
}

.track-card:hover {
  transform: translateX(5px);
  border-color: #667eea;
  background: #22223b;
}

.track-card.active {
  border-color: #667eea;
  background: rgba(102, 126, 234, 0.1);
}

.track-number {
  font-size: 0.9rem;
  color: #888;
  width: 35px;
}

.track-cover {
  width: 60px;
  height: 60px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

.track-cover img {
  width: 100%;
  height: 100%;
  border-radius: 12px;
  object-fit: cover;
}

.track-info {
  flex: 1;
}

.track-title {
  font-weight: 600;
  margin-bottom: 5px;
}

.track-artist {
  font-size: 0.85rem;
  color: #888;
}

.track-duration {
  font-size: 0.75rem;
  color: #666;
  margin-top: 5px;
}

.play-btn {
  width: 45px;
  height: 45px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border: none;
  border-radius: 12px;
  color: white;
  font-size: 18px;
  cursor: pointer;
  transition: transform 0.2s;
}

.play-btn:hover {
  transform: scale(1.05);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
  background: #1a1a2e;
  border-radius: 20px;
  color: #888;
}

.empty-icon {
  font-size: 50px;
  margin-bottom: 20px;
}

.skeleton {
  background: linear-gradient(90deg, #1a1a2e 25%, #22223b 50%, #1a1a2e 75%);
  background-size: 200% 100%;
  animation: loading 1.5s infinite;
}

@keyframes loading {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.skeleton-card {
  display: flex;
  gap: 15px;
  padding: 15px;
  background: #1a1a2e;
  border-radius: 15px;
  margin-bottom: 15px;
}

.skeleton-cover {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  background: #2a2a3e;
}

.skeleton-info {
  flex: 1;
}

.skeleton-title {
  height: 18px;
  width: 70%;
  background: #2a2a3e;
  border-radius: 5px;
  margin-bottom: 10px;
}

.skeleton-artist {
  height: 14px;
  width: 50%;
  background: #2a2a3e;
  border-radius: 5px;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(26, 26, 46, 0.95);
  backdrop-filter: blur(10px);
  border-top: 1px solid #2a2a3e;
  transform: translateY(100%);
  transition: transform 0.3s ease;
  z-index: 100;
}

.player.show {
  transform: translateY(0);
}

.player-progress {
  height: 3px;
  background: #2a2a3e;
  cursor: pointer;
  position: relative;
}

.progress-fill {
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 0%;
  background: linear-gradient(90deg, #667eea, #764ba2);
  transition: width 0.1s linear;
}

.player-content {
  display: flex;
  align-items: center;
  gap: 15px;
  padding: 15px 20px;
}

.player-cover {
  width: 50px;
  height: 50px;
  background: linear-gradient(135deg, #667eea, #764ba2);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 25px;
}

.player-cover img {
  width: 100%;
  height: 100%;
  border-radius: 10px;
  object-fit: cover;
}

.player-info {
  flex: 1;
}

.player-title {
  font-weight: 600;
  font-size: 0.9rem;
  margin-bottom: 3px;
}

.player-artist {
  font-size: 0.75rem;
  color: #888;
}

.player-controls {
  display: flex;
  align-items: center;
  gap: 10px;
}

.control-btn {
  width: 40px;
  height: 40px;
  background: #2a2a3e;
  border: none;
  border-radius: 10px;
  color: white;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.2s;
}

.control-btn:hover {
  background: #667eea;
}

.volume-slider {
  width: 80px;
  height: 4px;
  -webkit-appearance: none;
  background: #2a2a3e;
  border-radius: 2px;
  outline: none;
}

.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  background: #667eea;
  border-radius: 50%;
  cursor: pointer;
}

.toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #1a1a2e;
  border-left: 3px solid #667eea;
  padding: 12px 20px;
  border-radius: 10px;
  animation: slideIn 0.3s ease;
  z-index: 200;
}

@keyframes slideIn {
  from {
    transform: translateX(100%);
    opacity: 0;
  }
  to {
    transform: translateX(0);
    opacity: 1;
  }
}

@media (max-width: 600px) {
  .container {
    padding: 15px;
  }
  
  .player-content {
    padding: 10px 15px;
    gap: 10px;
  }
  
  .player-cover {
    width: 40px;
    height: 40px;
  }
  
  .control-btn {
    width: 35px;
    height: 35px;
  }
  
  .volume-slider {
    width: 60px;
  }
  
  .track-card {
    padding: 12px;
  }
  
  .track-cover {
    width: 50px;
    height: 50px;
  }
}
</style>
</head>
<body>

<header>
  <h1>🎵 Yamify</h1>
  <div class="subtitle">Stream & Download High Quality Music</div>
</header>

<div class="container">
  <div class="tabs">
    <button class="tab active" onclick="switchTab('search')">🔍 Search</button>
    <button class="tab" onclick="switchTab('download')">⬇ Download</button>
  </div>

  <div class="search-box">
    <input type="text" class="search-input" id="searchInput" placeholder="Search songs or paste Spotify URL...">
    <button class="search-btn" id="searchBtn" onclick="handleSubmit()">GO</button>
  </div>

  <div id="results" class="results"></div>
</div>

<div class="player" id="player">
  <div class="player-progress" id="progressBar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="player-content">
    <div class="player-cover" id="playerCover">🎵</div>
    <div class="player-info">
      <div class="player-title" id="playerTitle">—</div>
      <div class="player-artist" id="playerArtist">—</div>
    </div>
    <div class="player-controls">
      <button class="control-btn" id="playPauseBtn" onclick="togglePlay()">▶</button>
      <button class="control-btn" onclick="toggleMute()" id="muteBtn">🔊</button>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.01" value="0.8">
      <a href="#" id="downloadLink" download style="text-decoration:none">
        <button class="control-btn">⬇</button>
      </a>
      <button class="control-btn" onclick="closePlayer()">✕</button>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
let currentTab = 'search';
let searchResults = [];
let currentTrack = null;
let isPlaying = false;
let isMuted = false;
let audio = document.getElementById('audio');

function showToast(message, isError = false) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.borderLeftColor = isError ? '#ff4466' : '#667eea';
  toast.innerHTML = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  
  const input = document.getElementById('searchInput');
  if (tab === 'search') {
    input.placeholder = 'Search songs, artists, or albums...';
  } else {
    input.placeholder = 'Paste Spotify track URL...';
  }
  
  if (searchResults.length === 0 || tab === 'download') {
    document.getElementById('results').innerHTML = '';
  }
}

function showSkeleton() {
  const container = document.getElementById('results');
  container.innerHTML = `
    <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-artist"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-artist"></div></div></div>
    <div class="skeleton-card"><div class="skeleton-cover"></div><div class="skeleton-info"><div class="skeleton-title"></div><div class="skeleton-artist"></div></div></div>
  `;
}

function renderResults(tracks) {
  const container = document.getElementById('results');
  
  if (!tracks || tracks.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">🎧</div>
        <p>No results found. Try searching different keywords.</p>
      </div>
    `;
    return;
  }
  
  container.innerHTML = '';
  tracks.forEach((track, idx) => {
    const isActive = currentTrack && currentTrack.url === track.url;
    const card = document.createElement('div');
    card.className = `track-card ${isActive ? 'active' : ''}`;
    card.innerHTML = `
      <div class="track-number">${String(idx + 1).padStart(2, '0')}</div>
      <div class="track-cover">
        ${track.cover ? `<img src="${track.cover}" onerror="this.style.display='none';this.parentElement.innerHTML='🎵'">` : '🎵'}
      </div>
      <div class="track-info">
        <div class="track-title">${escapeHtml(track.title)}</div>
        <div class="track-artist">${escapeHtml(track.artist)}</div>
        <div class="track-duration">⏱ ${track.duration}</div>
      </div>
      <button class="play-btn" onclick="event.stopPropagation(); playTrack(${idx})">${isActive && isPlaying ? '⏸' : '▶'}</button>
    `;
    card.onclick = () => playTrack(idx);
    container.appendChild(card);
  });
}

async function handleSubmit() {
  const input = document.getElementById('searchInput').value.trim();
  if (!input) return;
  
  const btn = document.getElementById('searchBtn');
  btn.disabled = true;
  btn.textContent = '...';
  
  if (currentTab === 'search') {
    await searchMusic(input);
  } else {
    await downloadTrack(input);
  }
  
  btn.disabled = false;
  btn.textContent = 'GO';
}

async function searchMusic(query) {
  showSkeleton();
  
  try {
    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
    const data = await res.json();
    
    if (data.results) {
      searchResults = data.results;
      renderResults(searchResults);
      showToast(`Found ${searchResults.length} tracks`);
    } else {
      renderResults([]);
      showToast('No results found', true);
    }
  } catch (err) {
    console.error(err);
    renderResults([]);
    showToast('Failed to search', true);
  }
}

async function downloadTrack(url) {
  if (!url.includes('spotify.com/track/')) {
    showToast('Invalid Spotify track URL', true);
    return;
  }
  
  showSkeleton();
  
  try {
    const res = await fetch(`/api/track?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    
    if (data.error) {
      showToast(data.error, true);
      renderResults([]);
      return;
    }
    
    currentTrack = data;
    openPlayer(data);
    showToast('Track loaded successfully');
  } catch (err) {
    console.error(err);
    showToast('Failed to load track', true);
  }
}

async function playTrack(index) {
  const track = searchResults[index];
  
  if (currentTrack && currentTrack.url === track.url) {
    togglePlay();
  } else {
    showSkeleton();
    try {
      const res = await fetch(`/api/track?url=${encodeURIComponent(track.url)}`);
      const data = await res.json();
      
      if (data.error) {
        showToast(data.error, true);
        return;
      }
      
      currentTrack = data;
      openPlayer(data);
      renderResults(searchResults);
    } catch (err) {
      showToast('Failed to play track', true);
    }
  }
}

function openPlayer(track) {
  document.getElementById('playerTitle').textContent = track.title;
  document.getElementById('playerArtist').textContent = track.artist;
  
  const coverEl = document.getElementById('playerCover');
  if (track.cover) {
    coverEl.innerHTML = `<img src="${track.cover}" style="width:100%;height:100%;object-fit:cover">`;
  } else {
    coverEl.innerHTML = '🎵';
  }
  
  const downloadLink = document.getElementById('downloadLink');
  downloadLink.href = track.audioUrl;
  downloadLink.download = `${track.title}.mp3`;
  
  audio.src = track.audioUrl;
  audio.volume = parseFloat(document.getElementById('volumeSlider').value);
  
  audio.play().then(() => {
    isPlaying = true;
    updatePlayButton();
    document.getElementById('player').classList.add('show');
  }).catch(() => {
    showToast('Cannot play audio', true);
  });
  
  setupAudioEvents();
}

let eventsSetup = false;
function setupAudioEvents() {
  if (eventsSetup) return;
  
  audio.onplay = () => { isPlaying = true; updatePlayButton(); };
  audio.onpause = () => { isPlaying = false; updatePlayButton(); };
  audio.ontimeupdate = updateProgress;
  audio.onended = () => { isPlaying = false; updatePlayButton(); };
  
  eventsSetup = true;
}

function updatePlayButton() {
  const btn = document.getElementById('playPauseBtn');
  if (btn) btn.textContent = isPlaying ? '⏸' : '▶';
  if (searchResults.length) renderResults(searchResults);
}

function togglePlay() {
  if (isPlaying) audio.pause();
  else audio.play();
}

function updateProgress() {
  if (audio.duration) {
    const percent = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = percent + '%';
  }
}

function seekTrack(e) {
  const rect = document.getElementById('progressBar').getBoundingClientRect();
  const percent = (e.clientX - rect.left) / rect.width;
  audio.currentTime = percent * audio.duration;
}

function setVolume(value) {
  audio.volume = parseFloat(value);
  if (audio.volume > 0) isMuted = false;
  updateMuteIcon();
}

function toggleMute() {
  isMuted = !isMuted;
  audio.volume = isMuted ? 0 : parseFloat(document.getElementById('volumeSlider').value);
  updateMuteIcon();
}

function updateMuteIcon() {
  const btn = document.getElementById('muteBtn');
  if (btn) btn.textContent = isMuted ? '🔇' : '🔊';
}

function closePlayer() {
  audio.pause();
  isPlaying = false;
  currentTrack = null;
  document.getElementById('player').classList.remove('show');
  if (searchResults.length) renderResults(searchResults);
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/[&<>]/g, function(m) {
    if (m === '&') return '&amp;';
    if (m === '<') return '&lt;';
    if (m === '>') return '&gt;';
    return m;
  });
}

// Event listeners
document.getElementById('progressBar').addEventListener('click', seekTrack);
document.getElementById('volumeSlider').addEventListener('input', (e) => setVolume(e.target.value));
document.getElementById('searchInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') handleSubmit();
});

// Initial render
renderResults([]);
</script>
</body>
</html>
